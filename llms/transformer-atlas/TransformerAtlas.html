ur ready,\nSo make, and mercity lady than thee have true here,\nAnd with from the loving with as the field Buckingham,\nAnd I will, and ride promise and quickly as him.\n\nSICINIUS:\nAs you are you a queen,\nTo be no break of your son; and thou know ", "elapsed_s": 2926.94417}]}, "sources": {"config.py": "\"\"\"Configuration for the decoder-only Transformer.\n\nNotation used everywhere in this project:\n    B   batch size (sequences per microbatch)\n    T   sequence length of the current input (T <= T_max)\n    T_max   maximum context length = block_size (rows of the position table)\n    V   vocabulary size\n    D   model width (n_embd)\n    H   number of attention heads (n_head)\n    Dh  head dimension = D // H\n    L   number of Transformer blocks (n_layer). The loss is written `loss`, never L.\n    Dff feed-forward hidden width = ffn_mult * D\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import asdict, dataclass, field\n\n\n@dataclass\nclass ModelConfig:\n    vocab_size: int = 66      # V (65 characters + 1 reserved <unk> id)\n    block_size: int = 128     # T_max\n    n_layer: int = 4          # L\n    n_head: int = 4           # H\n    n_embd: int = 128         # D\n    ffn_mult: int = 4         # Dff = ffn_mult * D\n    dropout: float = 0.1\n    bias: bool = True         # biases in Linear layers (lm_head never has one)\n    tie_weights: bool = False # share tok_emb.weight with lm_head.weight\n    ln_eps: float = 1e-5      # LayerNorm epsilon (PyTorch default)\n\n    @property\n    def head_dim(self) -> int:\n        return self.n_embd // self.n_head\n\n    @property\n    def d_ff(self) -> int:\n        return self.ffn_mult * self.n_embd\n\n    def validate(self) -> None:\n        if self.n_embd % self.n_head != 0:\n            raise ValueError(\n                f\"n_embd (D={self.n_embd}) must be divisible by n_head (H={self.n_head}): D = H x Dh\"\n            )\n        for name in (\"vocab_size\", \"block_size\", \"n_layer\", \"n_head\", \"n_embd\", \"ffn_mult\"):\n            if getattr(self, name) < 1:\n                raise ValueError(f\"{name} must be >= 1\")\n        if not 0.0 <= self.dropout < 1.0:\n            raise ValueError(\"dropout must be in [0, 1)\")\n\n    def to_dict(self) -> dict:\n        return asdict(self)\n\n\n@dataclass\nclass TrainConfig:\n    data_path: str = \"data/input.txt\"\n    out_dir: str = \"out\"\n    seed: int = 1337\n    device: str = \"auto\"          # auto | cpu | cuda | mps\n    batch_size: int = 32          # B (microbatch)\n    grad_accum: int = 1           # microbatches per optimizer step\n    max_steps: int = 2500         # optimizer updates\n    lr: float = 1e-3\n    min_lr: float = 1e-4\n    warmup_steps: int = 100\n    weight_decay: float = 0.1\n    betas: tuple = (0.9, 0.99)\n    eps: float = 1e-8\n    grad_clip: float = 1.0        # 0 disables clipping\n    eval_interval: int = 250\n    eval_iters: int = 50\n    log_interval: int = 10\n    sample_chars: int = 300\n    split: tuple = (0.9, 0.05, 0.05)\n\n    def to_dict(self) -> dict:\n        d = asdict(self)\n        d[\"betas\"] = list(self.betas)\n        d[\"split\"] = list(self.split)\n        return d\n\n\n# The fully inspectable configuration used by the visual reference (export_micro.py).\n# Same code, same conventions; only sizes differ. Its vocabulary comes from a short excerpt.\nMICRO = dict(block_size=8, n_layer=1, n_head=2, n_embd=8, ffn_mult=4, dropout=0.0)\n", "tokenizer.py": "\"\"\"Reversible character-level tokenizer.\n\nVocabulary policy\n-----------------\n* The vocabulary is built from the TRAINING split only, so validation/test text\n  cannot influence the model's input space.\n* Id 0 is reserved for <unk>. Every observed training character gets an id >= 1,\n  assigned in sorted (Unicode code point) order, so the mapping is deterministic.\n* Unseen characters: `encode(strict=True)` (the default) raises UnknownCharacterError.\n  `encode(strict=False)` maps them to UNK_ID; decoding UNK_ID yields U+FFFD.\n  Only strict encoding is guaranteed to round-trip exactly.\n\nToken ids are categorical indices. Id 40 is not \"twice\" id 20; ids only select\nrows of the embedding table.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nUNK_ID = 0\nUNK_TOKEN = \"<unk>\"\nUNK_DECODED = \"\\ufffd\"\n\n\nclass UnknownCharacterError(ValueError):\n    def __init__(self, chars):\n        self.chars = sorted(set(chars))\n        super().__init__(f\"characters not in vocabulary: {self.chars!r}\")\n\n\nclass CharTokenizer:\n    def __init__(self, chars: list[str]):\n        if len(set(chars)) != len(chars):\n            raise ValueError(\"duplicate characters in vocabulary\")\n        if UNK_DECODED in chars:\n            raise ValueError(\"U+FFFD is reserved for decoding <unk>\")\n        self.chars = list(chars)                       # id i+1 -> chars[i]\n        self.itos = [UNK_TOKEN] + self.chars\n        self.stoi = {c: i + 1 for i, c in enumerate(self.chars)}\n\n    @classmethod\n    def build(cls, train_text: str) -> \"CharTokenizer\":\n        return cls(sorted(set(train_text)))\n\n    @property\n    def vocab_size(self) -> int:\n        return len(self.itos)\n\n    def encode(self, text: str, strict: bool = True) -> list[int]:\n        unknown = [c for c in text if c not in self.stoi]\n        if unknown and strict:\n            raise UnknownCharacterError(unknown)\n        return [self.stoi.get(c, UNK_ID) for c in text]\n\n    def decode(self, ids) -> str:\n        out = []\n        for i in ids:\n            i = int(i)\n            if not 0 <= i < self.vocab_size:\n                raise ValueError(f\"token id {i} outside [0, {self.vocab_size})\")\n            out.append(UNK_DECODED if i == UNK_ID else self.itos[i])\n        return \"\".join(out)\n\n    def to_dict(self) -> dict:\n        return {\"type\": \"char\", \"unk_id\": UNK_ID, \"chars\": self.chars}\n\n    @classmethod\n    def from_dict(cls, d: dict) -> \"CharTokenizer\":\n        assert d[\"type\"] == \"char\" and d[\"unk_id\"] == UNK_ID\n        return cls(d[\"chars\"])\n\n    def save(self, path) -> None:\n        Path(path).write_text(json.dumps(self.to_dict(), ensure_ascii=False, indent=1), encoding=\"utf-8\")\n\n    @classmethod\n    def load(cls, path) -> \"CharTokenizer\":\n        return cls.from_dict(json.loads(Path(path).read_text(encoding=\"utf-8\")))\n", "data.py": "\"\"\"Corpus loading, splitting, and (input, target) window sampling.\n\nThe corpus is split into contiguous character ranges BEFORE any windows are made.\nEach split becomes its own 1-D tensor of token ids, so a window can never span\ntwo splits.\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nfrom pathlib import Path\n\nimport torch\n\nTINY_SHAKESPEARE_URL = (\n    \"https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt\"\n)\nTINY_SHAKESPEARE_SHA256 = \"86c4e6aa9db7c042ec79f339dcb96d42b0075e16b8fc2e86bf0ca57e2dc565ed\"\n\n\ndef load_text(path) -> str:\n    raw = Path(path).read_bytes()\n    text = raw.decode(\"utf-8\")                         # fail loudly on invalid UTF-8\n    text = text.replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\")  # normalise line endings only\n    return text                                        # case, punctuation, whitespace kept\n\n\ndef sha256_of(path) -> str:\n    return hashlib.sha256(Path(path).read_bytes()).hexdigest()\n\n\ndef split_text(text: str, fractions=(0.9, 0.05, 0.05)) -> tuple[str, str, str]:\n    \"\"\"Contiguous split: first 90% train, next 5% validation, last 5% test.\"\"\"\n    assert abs(sum(fractions) - 1.0) < 1e-9\n    n = len(text)\n    i = int(n * fractions[0])\n    j = int(n * (fractions[0] + fractions[1]))\n    return text[:i], text[i:j], text[j:]\n\n\ndef get_batch(data: torch.Tensor, B: int, T: int, device, generator: torch.Generator):\n    \"\"\"Sample B random windows of T+1 tokens from ONE split.\n\n    x = tokens[start : start+T]        shape [B, T]\n    y = tokens[start+1 : start+T+1]    shape [B, T]   (shifted by one)\n    \"\"\"\n    if len(data) < T + 1:\n        raise ValueError(f\"split has {len(data)} tokens, need at least T+1={T + 1}\")\n    starts = torch.randint(len(data) - T, (B,), generator=generator)\n    x = torch.stack([data[s : s + T] for s in starts.tolist()])\n    y = torch.stack([data[s + 1 : s + T + 1] for s in starts.tolist()])\n    return x.to(device), y.to(device)\n\n\ndef sequential_windows(data: torch.Tensor, T: int, stride: int):\n    \"\"\"Deterministic windows (used for exhaustive evaluation). stride=T -> no overlap.\"\"\"\n    for s in range(0, len(data) - T, stride):\n        yield data[s : s + T], data[s + 1 : s + T + 1]\n", "model.py": "\"\"\"GPT-style decoder-only causal Transformer, written out explicitly.\n\nNo nn.Transformer, no nn.MultiheadAttention: Q/K/V projections, head reshaping,\ncausal masking, softmax and the output projection are all visible below.\n\nThe optional `trace` dict is only used by export_micro.py to record intermediate\ntensors for the visual reference. It never changes the computation.\n\"\"\"\nfrom __future__ import annotations\n\nimport math\n\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nfrom config import ModelConfig\n\n\ndef _rec(trace, key, t):\n    if trace is not None:\n        trace[key] = t.detach().clone()\n\n\nclass CausalSelfAttention(nn.Module):\n    def __init__(self, cfg: ModelConfig):\n        super().__init__()\n        D, H = cfg.n_embd, cfg.n_head\n        assert D % H == 0, \"D must equal H * Dh\"\n        self.n_head, self.head_dim = H, D // H\n        # nn.Linear stores weight as [out_features, in_features] and computes x @ W.T + b\n        self.q_proj = nn.Linear(D, D, bias=cfg.bias)   # W_Q: [D, D]\n        self.k_proj = nn.Linear(D, D, bias=cfg.bias)   # W_K: [D, D]\n        self.v_proj = nn.Linear(D, D, bias=cfg.bias)   # W_V: [D, D]\n        self.out_proj = nn.Linear(D, D, bias=cfg.bias) # W_O: [D, D]\n        self.attn_dropout = nn.Dropout(cfg.dropout)\n        self.resid_dropout = nn.Dropout(cfg.dropout)\n        T_max = cfg.block_size\n        mask = torch.tril(torch.ones(T_max, T_max, dtype=torch.bool))  # True = may attend\n        self.register_buffer(\"causal_mask\", mask.view(1, 1, T_max, T_max), persistent=False)\n        self.causal = True  # educational switch for the leakage demo; always True in training\n\n    def forward(self, x: torch.Tensor, trace=None) -> torch.Tensor:\n        B, T, D = x.shape\n        H, Dh = self.n_head, self.head_dim\n\n        q = self.q_proj(x)                                   # [B, T, D]\n        k = self.k_proj(x)                                   # [B, T, D]\n        v = self.v_proj(x)                                   # [B, T, D]\n\n        q = q.view(B, T, H, Dh).transpose(1, 2)              # [B, H, T, Dh]\n        k = k.view(B, T, H, Dh).transpose(1, 2)              # [B, H, T, Dh]\n        v = v.view(B, T, H, Dh).transpose(1, 2)              # [B, H, T, Dh]\n\n        scores = (q @ k.transpose(-2, -1)) / math.sqrt(Dh)   # [B, H, T, T]  rows=query i, cols=key j\n        _rec(trace, \"scores_raw\", scores)\n        if self.causal:\n            allowed = self.causal_mask[:, :, :T, :T]\n            scores = scores.masked_fill(~allowed, float(\"-inf\"))  # forbid j > i\n        _rec(trace, \"scores_masked\", scores)\n\n        probs = F.softmax(scores, dim=-1)                    # normalise over keys j; rows sum to 1\n        _rec(trace, \"probs\", probs)\n        probs = self.attn_dropout(probs)                     # training only; rows may no longer sum to 1\n\n        y = probs @ v                                        # [B, H, T, Dh]\n        _rec(trace, \"head_out\", y)\n        y = y.transpose(1, 2).contiguous().view(B, T, D)     # merge heads -> [B, T, D]\n        _rec(trace, \"merged\", y)\n        y = self.resid_dropout(self.out_proj(y))             # [B, T, D]\n        return y\n\n\nclass FeedForward(nn.Module):\n    def __init__(self, cfg: ModelConfig):\n        super().__init__()\n        self.fc1 = nn.Linear(cfg.n_embd, cfg.d_ff, bias=cfg.bias)   # W1: [Dff, D]\n        self.act = nn.GELU()                                        # exact (erf) GELU\n        self.fc2 = nn.Linear(cfg.d_ff, cfg.n_embd, bias=cfg.bias)   # W2: [D, Dff]\n        self.dropout = nn.Dropout(cfg.dropout)\n\n    def forward(self, x: torch.Tensor, trace=None) -> torch.Tensor:\n        h = self.fc1(x)                                      # [B, T, Dff]\n        _rec(trace, \"ffn_pre\", h)\n        h = self.act(h)                                      # [B, T, Dff]\n        _rec(trace, \"ffn_act\", h)\n        return self.dropout(self.fc2(h))                     # [B, T, D]\n\n\nclass Block(nn.Module):\n    \"\"\"Pre-LayerNorm block:  h1 = x + Attn(LN1(x));  h2 = h1 + FFN(LN2(h1)).\"\"\"\n\n    def __init__(self, cfg: ModelConfig):\n        super().__init__()\n        self.ln1 = nn.LayerNorm(cfg.n_embd, eps=cfg.ln_eps)\n        self.attn = CausalSelfAttention(cfg)\n        self.ln2 = nn.LayerNorm(cfg.n_embd, eps=cfg.ln_eps)\n        self.ffn = FeedForward(cfg)\n\n    def forward(self, x: torch.Tensor, trace=None) -> torch.Tensor:\n        a = self.ln1(x)\n        _rec(trace, \"ln1\", a)\n        h1 = x + self.attn(a, trace)                         # residual add: shapes must match [B, T, D]\n        _rec(trace, \"h1\", h1)\n        f = self.ln2(h1)\n        _rec(trace, \"ln2\", f)\n        h2 = h1 + self.ffn(f, trace)\n        _rec(trace, \"h2\", h2)\n        return h2\n\n\nclass GPT(nn.Module):\n    def __init__(self, cfg: ModelConfig):\n        super().__init__()\n        cfg.validate()\n        self.cfg = cfg\n        self.tok_emb = nn.Embedding(cfg.vocab_size, cfg.n_embd)   # [V, D]\n        self.pos_emb = nn.Embedding(cfg.block_size, cfg.n_embd)   # [T_max, D]\n        self.drop = nn.Dropout(cfg.dropout)\n        self.blocks = nn.ModuleList([Block(cfg) for _ in range(cfg.n_layer)])\n        self.ln_f = nn.LayerNorm(cfg.n_embd, eps=cfg.ln_eps)\n        self.lm_head = nn.Linear(cfg.n_embd, cfg.vocab_size, bias=False)  # [V, D]\n        if cfg.tie_weights:\n            self.lm_head.weight = self.tok_emb.weight          # one tensor, two uses\n        self.apply(self._init_weights)\n        for name, p in self.named_parameters():                # GPT-2 style residual scaling\n            if name.endswith(\"out_proj.weight\") or name.endswith(\"fc2.weight\"):\n                nn.init.normal_(p, mean=0.0, std=0.02 / math.sqrt(2 * cfg.n_layer))\n\n    @staticmethod\n    def _init_weights(m):\n        if isinstance(m, nn.Linear):\n            nn.init.normal_(m.weight, mean=0.0, std=0.02)\n            if m.bias is not None:\n                nn.init.zeros_(m.bias)\n        elif isinstance(m, nn.Embedding):\n            nn.init.normal_(m.weight, mean=0.0, std=0.02)\n\n    def num_params(self) -> int:\n        # .parameters() yields a tied tensor once, so this counts UNIQUE parameters\n        return sum(p.numel() for p in self.parameters())\n\n    def forward(self, idx: torch.Tensor, targets: torch.Tensor | None = None, trace=None):\n        B, T = idx.shape\n        if T > self.cfg.block_size:\n            raise ValueError(f\"sequence length {T} exceeds block_size {self.cfg.block_size}\")\n        pos = torch.arange(T, device=idx.device)              # [T]\n        tok = self.tok_emb(idx)                               # [B, T, D] row lookup\n        x = self.drop(tok + self.pos_emb(pos))                # [T, D] broadcasts over B\n        _rec(trace, \"x0\", x)\n        for i, block in enumerate(self.blocks):\n            bt = {} if trace is not None else None\n            x = block(x, bt)\n            if trace is not None:\n                trace[f\"block{i}\"] = bt\n        x = self.ln_f(x)                                      # [B, T, D]\n        _rec(trace, \"lnf\", x)\n        logits = self.lm_head(x)                              # [B, T, V]\n        loss = None\n        if targets is not None:\n            V = logits.size(-1)\n            loss = F.cross_entropy(logits.view(B * T, V), targets.view(B * T))  # expects raw logits\n        return logits, loss\n", "train.py": "\"\"\"Pretraining loop for the char-level GPT on Tiny Shakespeare.\n\npython train.py                       # fresh run (defaults in config.py)\npython train.py --resume              # continue from out/ckpt.pt with identical RNG/optimizer state\npython train.py --max_steps 200 --device cuda --batch_size 64\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport math\nimport random\nimport time\nfrom pathlib import Path\n\nimport numpy as np\nimport torch\n\nfrom checkpoint import load_checkpoint, restore_for_resume, save_checkpoint\nfrom config import ModelConfig, TrainConfig\nfrom data import get_batch, load_text, sha256_of, split_text\nfrom generate import generate\nfrom model import GPT\nfrom tokenizer import CharTokenizer\n\n\ndef set_seed(seed: int) -> None:\n    # Seeds make runs repeatable on the SAME hardware/software stack. Different GPUs,\n    # kernels, thread counts or library versions can still produce tiny numeric drift.\n    random.seed(seed)\n    np.random.seed(seed)\n    torch.manual_seed(seed)\n\n\ndef pick_device(name: str) -> str:\n    if name != \"auto\":\n        return name\n    if torch.cuda.is_available():\n        return \"cuda\"\n    if getattr(torch.backends, \"mps\", None) and torch.backends.mps.is_available():\n        return \"mps\"\n    return \"cpu\"\n\n\ndef lr_at(step: int, tc: TrainConfig) -> float:\n    \"\"\"Linear warmup, then cosine decay from lr to min_lr.\"\"\"\n    if step < tc.warmup_steps:\n        return tc.lr * (step + 1) / tc.warmup_steps\n    progress = (step - tc.warmup_steps) / max(1, tc.max_steps - tc.warmup_steps)\n    return tc.min_lr + 0.5 * (tc.lr - tc.min_lr) * (1 + math.cos(math.pi * min(1.0, progress)))\n\n\ndef make_optimizer(model: GPT, tc: TrainConfig) -> torch.optim.AdamW:\n    # Decoupled weight decay on matrices (Linear weights, embeddings); none on biases / LayerNorm.\n    decay = [p for p in model.parameters() if p.dim() >= 2]\n    no_decay = [p for p in model.parameters() if p.dim() < 2]\n    groups = [{\"params\": decay, \"weight_decay\": tc.weight_decay},\n              {\"params\": no_decay, \"weight_decay\": 0.0}]\n    return torch.optim.AdamW(groups, lr=tc.lr, betas=tuple(tc.betas), eps=tc.eps)\n\n\n@torch.no_grad()\ndef estimate_loss(model, splits: dict, tc: TrainConfig, T: int, device, gen) -> dict:\n    model.eval()                                   # dropout OFF for evaluation\n    out = {}\n    for name, data in splits.items():\n        losses = torch.zeros(tc.eval_iters)\n        for i in range(tc.eval_iters):\n            x, y = get_batch(data, tc.batch_size, T, device, gen)\n            _, loss = model(x, y)\n            losses[i] = loss.item()\n        out[name] = losses.mean().item()\n    model.train()\n    return out\n\n\ndef main():\n    ap = argparse.ArgumentParser()\n    tc_defaults, mc_defaults = TrainConfig(), ModelConfig()\n    for k, v in tc_defaults.to_dict().items():\n        if not isinstance(v, list):\n            ap.add_argument(f\"--{k}\", type=type(v), default=v)\n    for k in (\"block_size\", \"n_layer\", \"n_head\", \"n_embd\", \"ffn_mult\", \"dropout\"):\n        ap.add_argument(f\"--{k}\", type=type(getattr(mc_defaults, k)), default=getattr(mc_defaults, k))\n    ap.add_argument(\"--tie_weights\", action=\"store_true\")\n    ap.add_argument(\"--resume\", action=\"store_true\")\n    args = ap.parse_args()\n\n    tc = TrainConfig(**{k: getattr(args, k) for k in tc_defaults.to_dict() if hasattr(args, k)})\n    out_dir = Path(tc.out_dir)\n    out_dir.mkdir(parents=True, exist_ok=True)\n    ckpt_path = out_dir / \"ckpt.pt\"\n    set_seed(tc.seed)\n    device = pick_device(tc.device)\n\n    # ---- data: split first, then tokenize each split with a train-only vocabulary ----\n    text = load_text(tc.data_path)\n    train_txt, val_txt, test_txt = split_text(text, tc.split)\n    tok = CharTokenizer.build(train_txt)\n    splits = {name: torch.tensor(tok.encode(t, strict=False), dtype=torch.long)\n              for name, t in ((\"train\", train_txt), (\"val\", val_txt))}\n    data_info = {\"path\": tc.data_path, \"sha256\": sha256_of(tc.data_path), \"chars\": len(text),\n                 \"split_chars\": [len(train_txt), len(val_txt), len(test_txt)],\n                 \"unk_in_val\": int((splits[\"val\"] == 0).sum())}\n\n    mc = ModelConfig(vocab_size=tok.vocab_size, block_size=args.block_size, n_layer=args.n_layer,\n                     n_head=args.n_head, n_embd=args.n_embd, ffn_mult=args.ffn_mult,\n                     dropout=args.dropout, tie_weights=args.tie_weights)\n    model = GPT(mc).to(device)\n    opt = make_optimizer(model, tc)\n    data_gen = torch.Generator().manual_seed(tc.seed)      # dedicated sampler RNG (saved in ckpt)\n    eval_gen = torch.Generator()\n    start_step = 0\n    if args.resume:\n        start_step = restore_for_resume(load_checkpoint(ckpt_path, device), model, opt, data_gen)\n        print(f\"resumed at step {start_step}\")\n    print(f\"device={device}  params={model.num_params():,}  V={mc.vocab_size}  {data_info}\")\n    tok.save(out_dir / \"vocab.json\")\n\n    log = open(out_dir / \"log.jsonl\", \"a\")\n    T, t0 = mc.block_size, time.time()\n    for step in range(start_step, tc.max_steps + 1):\n        lr = lr_at(step, tc)\n        for g in opt.param_groups:\n            g[\"lr\"] = lr\n\n        if step % tc.eval_interval == 0 or step == tc.max_steps:\n            eval_gen.manual_seed(1234)                       # same eval batches every time\n            losses = estimate_loss(model, splits, tc, T, device, eval_gen)\n            sample_gen = torch.Generator().manual_seed(0)\n            prompt = torch.tensor([tok.encode(\"\\n\")], dtype=torch.long, device=device)\n            sample = tok.decode(generate(model, prompt, tc.sample_chars, 0.8, None, sample_gen)[0].tolist())\n            rec = {\"type\": \"eval\", \"step\": step, \"train_loss\": losses[\"train\"], \"val_loss\": losses[\"val\"],\n                   \"val_ppl\": math.exp(losses[\"val\"]), \"sample\": sample, \"elapsed_s\": time.time() - t0}\n            log.write(json.dumps(rec) + \"\\n\"); log.flush()\n            print(f\"step {step:5d} | train {losses['train']:.4f} | val {losses['val']:.4f}\")\n            save_checkpoint(ckpt_path, model=model, optimizer=opt, step=step, tokenizer=tok,\n                            train_cfg=tc.to_dict(), data_gen=data_gen, data_info=data_info,\n                            metrics=losses)\n        if step == tc.max_steps:\n            break\n\n        # ---- one optimizer step (possibly several microbatches) ----\n        model.train()\n        opt.zero_grad(set_to_none=True)                     # PyTorch ACCUMULATES .grad otherwise\n        loss_sum = 0.0\n        for _ in range(tc.grad_accum):\n            x, y = get_batch(splits[\"train\"], tc.batch_size, T, device, data_gen)\n            _, loss = model(x, y)                           # forward + mean CE over B*T targets\n            (loss / tc.grad_accum).backward()               # scale so summed grads = mean over all microbatches\n            loss_sum += loss.item()\n        if tc.grad_clip > 0:\n            gnorm = torch.nn.utils.clip_grad_norm_(model.parameters(), tc.grad_clip)  # returns pre-clip norm\n        else:\n            gnorm = torch.sqrt(sum((p.grad.detach() ** 2).sum() for p in model.parameters()))\n        opt.step()                                          # AdamW update\n\n        if step % tc.log_interval == 0:\n            rec = {\"type\": \"train\", \"step\": step, \"loss\": loss_sum / tc.grad_accum, \"lr\": lr,\n                   \"grad_norm\": float(gnorm), \"elapsed_s\": time.time() - t0}\n            log.write(json.dumps(rec) + \"\\n\")\n    log.close()\n\n\nif __name__ == \"__main__\":\n    main()\n", "checkpoint.py": "\"\"\"Checkpoint save/load.\n\nInference needs:  model state_dict + model config + tokenizer.\nResuming needs:   all of the above + optimizer state (AdamW moments and step counts)\n                  + training step + RNG states (Python, NumPy, torch CPU/CUDA, data sampler)\n                  + training config + dataset identity.\nSaving weights alone is NOT enough to continue training identically.\n\"\"\"\nfrom __future__ import annotations\n\nimport os\nimport random\nfrom pathlib import Path\n\nimport numpy as np\nimport torch\n\nfrom config import ModelConfig\nfrom model import GPT\nfrom tokenizer import CharTokenizer\n\nFORMAT_VERSION = 1\n\n\ndef _rng_state(data_gen: torch.Generator | None) -> dict:\n    np_state = np.random.get_state()\n    return {\n        \"python\": random.getstate(),\n        \"numpy\": [np_state[0], np_state[1].tolist(), int(np_state[2]), int(np_state[3]), float(np_state[4])],\n        \"torch_cpu\": torch.get_rng_state(),\n        \"torch_cuda\": torch.cuda.get_rng_state_all() if torch.cuda.is_available() else [],\n        \"data_generator\": data_gen.get_state() if data_gen is not None else None,\n    }\n\n\ndef _restore_rng(state: dict, data_gen: torch.Generator | None) -> None:\n    random.setstate(state[\"python\"])\n    n = state[\"numpy\"]\n    np.random.set_state((n[0], np.array(n[1], dtype=np.uint32), n[2], n[3], n[4]))\n    torch.set_rng_state(state[\"torch_cpu\"])\n    if torch.cuda.is_available() and state[\"torch_cuda\"]:\n        torch.cuda.set_rng_state_all(state[\"torch_cuda\"])\n    if data_gen is not None and state[\"data_generator\"] is not None:\n        data_gen.set_state(state[\"data_generator\"])\n\n\ndef save_checkpoint(path, *, model, optimizer, step, tokenizer, train_cfg: dict,\n                    data_gen=None, data_info=None, metrics=None) -> None:\n    ckpt = {\n        \"format_version\": FORMAT_VERSION,\n        \"model\": model.state_dict(),\n        \"model_config\": model.cfg.to_dict(),\n        \"tokenizer\": tokenizer.to_dict(),\n        \"optimizer\": optimizer.state_dict() if optimizer is not None else None,\n        \"step\": step,                       # number of optimizer updates already applied\n        \"train_config\": train_cfg,\n        \"rng\": _rng_state(data_gen),\n        \"data\": data_info or {},\n        \"metrics\": metrics or {},\n        \"torch_version\": str(torch.__version__),   # plain str: loadable with weights_only=True\n    }\n    path = Path(path)\n    path.parent.mkdir(parents=True, exist_ok=True)\n    tmp = path.with_suffix(\".tmp\")\n    torch.save(ckpt, tmp)\n    os.replace(tmp, path)                   # atomic: never leaves a half-written checkpoint\n\n\ndef load_checkpoint(path, device=\"cpu\") -> dict:\n    # weights_only=True: only tensors and plain Python containers are unpickled\n    return torch.load(path, map_location=device, weights_only=True)\n\n\ndef load_for_inference(path, device=\"cpu\"):\n    ckpt = load_checkpoint(path, device)\n    model = GPT(ModelConfig(**ckpt[\"model_config\"])).to(device)\n    model.load_state_dict(ckpt[\"model\"])\n    model.eval()\n    tok = CharTokenizer.from_dict(ckpt[\"tokenizer\"])\n    return model, tok, ckpt\n\n\ndef restore_for_resume(ckpt: dict, model, optimizer, data_gen) -> int:\n    model.load_state_dict(ckpt[\"model\"])\n    optimizer.load_state_dict(ckpt[\"optimizer\"])\n    _restore_rng(ckpt[\"rng\"], data_gen)\n    return ckpt[\"step\"]\n", "generate.py": "\"\"\"Autoregressive generation (no KV cache: the full context is recomputed each step).\"\"\"\nfrom __future__ import annotations\n\nimport argparse\n\nimport torch\n\nfrom checkpoint import load_for_inference\n\n\n@torch.no_grad()\ndef generate(model, idx: torch.Tensor, max_new_tokens: int, temperature: float = 1.0,\n             top_k: int | None = None, generator: torch.Generator | None = None) -> torch.Tensor:\n    \"\"\"idx: [B, T0] token ids. Returns [B, T0 + max_new_tokens].\"\"\"\n    model.eval()                                         # disables dropout\n    T_max = model.cfg.block_size\n    for _ in range(max_new_tokens):\n        idx_cond = idx[:, -T_max:]                       # crop: learned positions only exist for 0..T_max-1\n        logits, _ = model(idx_cond)                      # [B, T, V]\n        logits = logits[:, -1, :]                        # only the last position predicts the NEXT token\n        if temperature <= 0:\n            next_id = logits.argmax(dim=-1, keepdim=True)            # greedy\n        else:\n            logits = logits / temperature\n            if top_k is not None:\n                kth = torch.topk(logits, min(top_k, logits.size(-1))).values[:, -1:]\n                logits = logits.masked_fill(logits < kth, float(\"-inf\"))\n            probs = torch.softmax(logits, dim=-1)                    # [B, V]\n            next_id = torch.multinomial(probs, 1, generator=generator)  # [B, 1]\n        idx = torch.cat([idx, next_id], dim=1)           # append and repeat: inherently sequential\n    return idx\n\n\ndef main():\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--ckpt\", default=\"out/ckpt.pt\")\n    ap.add_argument(\"--prompt\", default=\"ROMEO:\\n\")\n    ap.add_argument(\"--max_new_tokens\", type=int, default=300)\n    ap.add_argument(\"--temperature\", type=float, default=0.8)\n    ap.add_argument(\"--top_k\", type=int, default=None)\n    ap.add_argument(\"--seed\", type=int, default=0)\n    args = ap.parse_args()\n\n    model, tok, ckpt = load_for_inference(args.ckpt)\n    g = torch.Generator().manual_seed(args.seed)\n    idx = torch.tensor([tok.encode(args.prompt)], dtype=torch.long)\n    out = generate(model, idx, args.max_new_tokens, args.temperature, args.top_k, g)\n    print(tok.decode(out[0].tolist()))\n\n\nif __name__ == \"__main__\":\n    main()\n", "serve.py": "\"\"\"Minimal educational HTTP endpoint (not production serving: no batching, no KV cache).\n\nRun:  CKPT=out/ckpt.pt uvicorn serve:app --port 8000\nTry:  curl -s localhost:8000/generate -H 'content-type: application/json' \\\n        -d '{\"prompt\": \"ROMEO:\\\\n\", \"max_new_tokens\": 120, \"temperature\": 0.8, \"seed\": 1}'\n\"\"\"\nfrom __future__ import annotations\n\nimport os\nfrom contextlib import asynccontextmanager\n\nimport torch\nfrom fastapi import FastAPI, HTTPException\nfrom pydantic import BaseModel, Field\n\nfrom checkpoint import load_for_inference\nfrom generate import generate\nfrom tokenizer import UnknownCharacterError\n\nMAX_PROMPT_CHARS = 1000\nMAX_NEW_TOKENS = 1000\nSTATE: dict = {}\n\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    model, tok, ckpt = load_for_inference(os.environ.get(\"CKPT\", \"out/ckpt.pt\"))  # load ONCE\n    STATE.update(model=model, tok=tok, step=ckpt[\"step\"])\n    yield\n    STATE.clear()\n\n\napp = FastAPI(title=\"Tiny Shakespeare char-GPT (educational)\", lifespan=lifespan)\n\n\nclass GenerateRequest(BaseModel):\n    prompt: str = Field(..., min_length=1, max_length=MAX_PROMPT_CHARS)\n    max_new_tokens: int = Field(200, ge=1, le=MAX_NEW_TOKENS)\n    temperature: float = Field(0.8, ge=0.0, le=2.0)   # 0 = greedy\n    top_k: int | None = Field(None, ge=1)\n    seed: int | None = None\n\n\nclass GenerateResponse(BaseModel):\n    completion: str\n    prompt_tokens: int\n    generated_tokens: int\n    model_step: int\n\n\n@app.get(\"/health\")\ndef health():\n    return {\"status\": \"ok\", \"model_step\": STATE.get(\"step\")}\n\n\n@app.post(\"/generate\", response_model=GenerateResponse)\ndef generate_endpoint(req: GenerateRequest):\n    model, tok = STATE[\"model\"], STATE[\"tok\"]\n    try:\n        ids = tok.encode(req.prompt, strict=True)\n    except UnknownCharacterError as e:\n        raise HTTPException(status_code=422, detail={\n            \"error\": \"prompt contains characters outside the model vocabulary\",\n            \"unknown_characters\": e.chars})\n    g = torch.Generator().manual_seed(req.seed) if req.seed is not None else None\n    idx = torch.tensor([ids], dtype=torch.long)\n    out = generate(model, idx, req.max_new_tokens, req.temperature, req.top_k, g)\n    new_ids = out[0, len(ids):].tolist()\n    return GenerateResponse(completion=tok.decode(new_ids), prompt_tokens=len(ids),\n                            generated_tokens=len(new_ids), model_step=STATE[\"step\"])\n", "measure_memory.py": "\"\"\"Measure peak CUDA memory for ONE training step of a given configuration.\n\npython measure_memory.py --batch_size 32 --block_size 128\npython measure_memory.py --batch_size 8 --block_size 1024 --n_layer 12 --n_head 12 --n_embd 768 --vocab_size 50257\n\nReports PyTorch's caching-allocator counters:\n  max_memory_allocated  bytes actually held by tensors at the peak\n  max_memory_reserved   bytes the allocator reserved from the driver (>= allocated)\nCompare with the analytical estimator in the visual reference (chapter 13).\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\n\nimport torch\n\nfrom config import ModelConfig\nfrom model import GPT\n\n\ndef main():\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--vocab_size\", type=int, default=66)\n    ap.add_argument(\"--block_size\", type=int, default=128)\n    ap.add_argument(\"--n_layer\", type=int, default=4)\n    ap.add_argument(\"--n_head\", type=int, default=4)\n    ap.add_argument(\"--n_embd\", type=int, default=128)\n    ap.add_argument(\"--dropout\", type=float, default=0.1)\n    ap.add_argument(\"--batch_size\", type=int, default=32)\n    ap.add_argument(\"--dtype\", choices=[\"float32\", \"bfloat16\"], default=\"float32\")\n    args = ap.parse_args()\n    if not torch.cuda.is_available():\n        raise SystemExit(\"CUDA is not available: this script measures GPU memory and needs a CUDA device.\")\n\n    dev = \"cuda\"\n    cfg = ModelConfig(vocab_size=args.vocab_size, block_size=args.block_size, n_layer=args.n_layer,\n                      n_head=args.n_head, n_embd=args.n_embd, dropout=args.dropout)\n    model = GPT(cfg).to(dev)\n    if args.dtype == \"bfloat16\":\n        model = model.to(torch.bfloat16)   # pure bf16 (no master weights): simplest possible setup\n    opt = torch.optim.AdamW(model.parameters(), lr=1e-3)\n    x = torch.randint(0, cfg.vocab_size, (args.batch_size, cfg.block_size), device=dev)\n    y = torch.randint(0, cfg.vocab_size, (args.batch_size, cfg.block_size), device=dev)\n\n    # warm-up step so AdamW allocates its state (exp_avg, exp_avg_sq) before measuring\n    model(x, y)[1].backward(); opt.step(); opt.zero_grad(set_to_none=True)\n    torch.cuda.synchronize()\n\n    torch.cuda.reset_peak_memory_stats()\n    base = torch.cuda.memory_allocated()          # params + optimizer state, no grads, no activations\n    _, loss = model(x, y)\n    after_fwd = torch.cuda.memory_allocated()     # + saved activations\n    loss.backward()\n    opt.step()\n    opt.zero_grad(set_to_none=True)\n    torch.cuda.synchronize()\n\n    gib = 2 ** 30\n    print(f\"parameters            {model.num_params():,}\")\n    print(f\"resident before step  {base / gib:8.3f} GiB  (weights + AdamW state)\")\n    print(f\"after forward         {after_fwd / gib:8.3f} GiB  (+ activations saved for backward)\")\n    print(f\"peak allocated        {torch.cuda.max_memory_allocated() / gib:8.3f} GiB\")\n    print(f\"peak reserved         {torch.cuda.max_memory_reserved() / gib:8.3f} GiB\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "export_micro.py": "\"\"\"Record the fully inspectable micro-example used by the visual reference.\n\nSame GPT class, same tokenizer class, same optimizer factory as the real run;\nonly the sizes differ (B=1, T=8, D=8, H=2, Dh=4, L=1, Dff=32).\n\nWrites web/data/micro.json containing REAL values:\n  * the excerpt, its vocabulary and the canonical (input, target) window\n  * every parameter (snapshot right before the recorded step)\n  * every intermediate activation of the forward pass\n  * every parameter gradient from loss.backward()\n  * AdamW state before/after and parameter values after optimizer.step()\n  * masked vs unmasked training curves (the leakage demonstration)\n  * a gradient-accumulation comparison and a finite-difference check\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport math\nfrom pathlib import Path\n\nimport torch\n\nfrom config import MICRO, ModelConfig, TrainConfig\nfrom data import load_text\nfrom model import GPT\nfrom tokenizer import CharTokenizer\nfrom train import make_optimizer\n\nSEED = 1337\nEXCERPT_CHARS = 250\nPRETRAIN_STEPS = 1500\n\n\ndef r(t):\n    \"\"\"tensor -> nested list rounded to float32-meaningful precision\"\"\"\n    if isinstance(t, torch.Tensor):\n        t = t.detach().double().tolist()\n    if isinstance(t, list):\n        return [r(v) for v in t]\n    if isinstance(t, float):\n        if math.isinf(t):\n            return \"-inf\" if t < 0 else \"inf\"\n        return float(f\"{t:.9g}\")\n    return t\n\n\ndef windows(ids, T, B, g):\n    starts = torch.randint(len(ids) - T, (B,), generator=g)\n    x = torch.stack([ids[s:s + T] for s in starts.tolist()])\n    y = torch.stack([ids[s + 1:s + T + 1] for s in starts.tolist()])\n    return x, y\n\n\ndef pretrain(model, ids, tc, steps, seed):\n    opt = make_optimizer(model, tc)\n    g = torch.Generator().manual_seed(seed)\n    curve = []\n    for step in range(steps):\n        x, y = windows(ids, model.cfg.block_size, 8, g)\n        opt.zero_grad(set_to_none=True)\n        _, loss = model(x, y)\n        loss.backward()\n        torch.nn.utils.clip_grad_norm_(model.parameters(), tc.grad_clip)\n        opt.step()\n        curve.append(round(loss.item(), 5))\n    return opt, curve\n\n\ndef main():\n    text = load_text(\"data/input.txt\")\n    excerpt = text[:EXCERPT_CHARS]\n    tok = CharTokenizer.build(excerpt)\n    ids = torch.tensor(tok.encode(excerpt))\n    cfg = ModelConfig(vocab_size=tok.vocab_size, **MICRO)\n    tc = TrainConfig(lr=1e-2, weight_decay=0.1, grad_clip=1.0)\n\n    # --- masked model: the valid baseline ---\n    torch.manual_seed(SEED)\n    model = GPT(cfg)\n    init_state = {k: v.clone() for k, v in model.state_dict().items()}\n    opt, curve_masked = pretrain(model, ids, tc, PRETRAIN_STEPS, SEED)\n\n    # --- same init, same batches, mask removed: leakage demo (never a valid config) ---\n    leaky = GPT(cfg)\n    leaky.load_state_dict(init_state)\n    for b in leaky.blocks:\n        b.attn.causal = False\n    _, curve_leaky = pretrain(leaky, ids, tc, PRETRAIN_STEPS, SEED)\n\n    # --- the recorded step ---\n    T = cfg.block_size\n    x = ids[None, :T]\n    y = ids[None, 1:T + 1]\n    model.train()  # dropout = 0, so train/eval give identical numbers here\n    params_before = {n: p.detach().clone() for n, p in model.named_parameters()}\n    adam_before = {}\n    for n, p in model.named_parameters():\n        st = opt.state[p]\n        adam_before[n] = {\"exp_avg\": r(st[\"exp_avg\"]), \"exp_avg_sq\": r(st[\"exp_avg_sq\"]),\n                          \"step\": int(st[\"step\"].item())}\n\n    opt.zero_grad(set_to_none=True)\n    trace = {}\n    logits, loss = model(x, y, trace=trace)\n    loss.backward()\n    grads = {n: p.grad.detach().clone() for n, p in model.named_parameters()}\n    total_norm = torch.nn.utils.clip_grad_norm_(model.parameters(), tc.grad_clip).item()\n    clipped = {n: p.grad.detach().clone() for n, p in model.named_parameters()}\n    lr = opt.param_groups[0][\"lr\"]\n    opt.step()\n    params_after = {n: p.detach().clone() for n, p in model.named_parameters()}\n    adam_after = {n: {\"exp_avg\": r(opt.state[p][\"exp_avg\"]), \"exp_avg_sq\": r(opt.state[p][\"exp_avg_sq\"]),\n                      \"step\": int(opt.state[p][\"step\"].item())} for n, p in model.named_parameters()}\n    with torch.no_grad():\n        _, loss_after = model(x, y)\n\n    wd = {}\n    for gi, group in enumerate(opt.param_groups):\n        for p in group[\"params\"]:\n            for n, q in model.named_parameters():\n                if q is p:\n                    wd[n] = group[\"weight_decay\"]\n\n    # --- unmasked forward on the SAME pre-step weights (illustrates what leaks) ---\n    probe = GPT(cfg)\n    probe.load_state_dict({n: params_before[n] for n in params_before}, strict=False)\n    for b in probe.blocks:\n        b.attn.causal = False\n    utrace = {}\n    with torch.no_grad():\n        ulogits, uloss = probe(x, y, trace=utrace)\n\n    # --- gradient accumulation on two windows (real numbers) ---\n    ga = GPT(cfg)\n    ga.load_state_dict({n: params_before[n] for n in params_before}, strict=False)\n    xb = torch.stack([ids[0:T], ids[9:9 + T]])\n    yb = torch.stack([ids[1:T + 1], ids[10:10 + T]])\n    ga(xb, yb)[1].backward()\n    full = ga.lm_head.weight.grad.clone()\n    ga.zero_grad()\n    for i in range(2):\n        (ga(xb[i:i + 1], yb[i:i + 1])[1] / 2).backward()\n    acc_scaled = ga.lm_head.weight.grad.clone()\n    ga.zero_grad()\n    for i in range(2):\n        ga(xb[i:i + 1], yb[i:i + 1])[1].backward()\n    acc_unscaled = ga.lm_head.weight.grad.clone()\n    grad_accum = {\"param\": \"lm_head.weight\", \"windows\": [tok.decode(xb[0].tolist()), tok.decode(xb[1].tolist())],\n                  \"full\": r(full), \"accum_scaled\": r(acc_scaled), \"accum_unscaled\": r(acc_unscaled),\n                  \"max_abs_diff_scaled\": (full - acc_scaled).abs().max().item(),\n                  \"ratio_unscaled\": (acc_unscaled.norm() / full.norm()).item()}\n\n    # --- finite-difference check in float64 on the same weights ---\n    fd_model = GPT(cfg).double()\n    fd_model.load_state_dict({n: params_before[n].double() for n in params_before}, strict=False)\n    fd_model(x, y)[1].backward()\n    fd = []\n    eps = 1e-6\n    for name, idx in ((\"blocks.0.attn.q_proj.weight\", (1, 2)), (\"tok_emb.weight\", (int(x[0, 0]), 3)),\n                      (\"blocks.0.ffn.fc1.bias\", (5,)), (\"lm_head.weight\", (int(y[0, 0]), 0))):\n        p = dict(fd_model.named_parameters())[name]\n        old = p.data[idx].item()\n        p.data[idx] = old + eps\n        lp = fd_model(x, y)[1].item()\n        p.data[idx] = old - eps\n        lm = fd_model(x, y)[1].item()\n        p.data[idx] = old\n        fd.append({\"param\": name, \"index\": list(idx), \"numeric\": (lp - lm) / (2 * eps),\n                   \"autograd\": p.grad[idx].item()})\n\n    blk = trace[\"block0\"]\n    out = {\n        \"provenance\": \"Recorded from export_micro.py (PyTorch %s, CPU, float32).\" % torch.__version__,\n        \"excerpt\": excerpt,\n        \"vocab\": tok.itos,\n        \"config\": {**cfg.to_dict(), \"head_dim\": cfg.head_dim, \"d_ff\": cfg.d_ff},\n        \"seed\": SEED,\n        \"pretrain_steps\": PRETRAIN_STEPS,\n        \"optimizer\": {\"type\": \"AdamW\", \"lr\": lr, \"betas\": list(tc.betas), \"eps\": tc.eps,\n                      \"weight_decay\": wd, \"grad_clip\": tc.grad_clip},\n        \"input_ids\": x[0].tolist(), \"target_ids\": y[0].tolist(),\n        \"input_text\": tok.decode(x[0].tolist()), \"target_text\": tok.decode(y[0].tolist()),\n        \"params\": {n: r(p) for n, p in params_before.items()},\n        \"shapes\": {n: list(p.shape) for n, p in params_before.items()},\n        \"trace\": {\n            \"x0\": r(trace[\"x0\"][0]), \"ln1\": r(blk[\"ln1\"][0]),\n            \"scores_raw\": r(blk[\"scores_raw\"][0]), \"scores_masked\": r(blk[\"scores_masked\"][0]),\n            \"probs\": r(blk[\"probs\"][0]), \"head_out\": r(blk[\"head_out\"][0]), \"merged\": r(blk[\"merged\"][0]),\n            \"h1\": r(blk[\"h1\"][0]), \"ln2\": r(blk[\"ln2\"][0]), \"ffn_pre\": r(blk[\"ffn_pre\"][0]),\n            \"ffn_act\": r(blk[\"ffn_act\"][0]), \"h2\": r(blk[\"h2\"][0]), \"lnf\": r(trace[\"lnf\"][0]),\n            \"logits\": r(logits[0]), \"loss\": loss.item(),\n        },\n        \"grads\": {n: r(g) for n, g in grads.items()},\n        \"grad_norm_total\": total_norm,\n        \"grad_clipped\": total_norm > tc.grad_clip,\n        \"grads_clipped\": {n: r(g) for n, g in clipped.items()},\n        \"adam_before\": adam_before, \"adam_after\": adam_after,\n        \"params_after\": {n: r(p) for n, p in params_after.items()},\n        \"loss_after_step\": loss_after.item(),\n        \"unmasked\": {\"probs\": r(utrace[\"block0\"][\"probs\"][0]), \"logits\": r(ulogits[0]), \"loss\": uloss.item()},\n        \"curves\": {\"masked\": curve_masked, \"unmasked\": curve_leaky},\n        \"grad_accum\": grad_accum,\n        \"finite_difference\": fd,\n    }\n    Path(\"web/data\").mkdir(parents=True, exist_ok=True)\n    Path(\"web/data/micro.json\").write_text(json.dumps(out))\n    print(f\"V={tok.vocab_size} loss={loss.item():.4f} after={loss_after.item():.4f} \"\n          f\"gnorm={total_norm:.4f} unmasked_loss={uloss.item():.4f} \"\n          f\"final curves masked={curve_masked[-1]} leaky={curve_leaky[-1]}\")\n    for f in fd:\n        print(f)\n\n\nif __name__ == \"__main__\":\n    main()\n", "export_trained.py": "\"\"\"Record facts about the trained checkpoint for the visual reference (web/data/trained.json).\n\nEverything here is measured from out/ckpt.pt and out/log.jsonl:\nparameter breakdown, checkpoint contents, reload equivalence, exhaustive\nvalidation/test loss, attention maps for one validation prompt, gradient norms\nfor one batch, generated samples, and one real request to the FastAPI app.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport math\nimport os\nimport platform\nimport sys\nimport tempfile\nfrom pathlib import Path\n\nimport torch\nimport torch.nn.functional as F\n\nfrom checkpoint import load_checkpoint, load_for_inference, save_checkpoint\nfrom data import load_text, sequential_windows, split_text\nfrom generate import generate\n\nCKPT = Path(\"out/ckpt.pt\")\n\n\ndef rnd(t, d=4):\n    return [rnd(x, d) for x in t] if isinstance(t, list) else round(t, d)\n\n\n@torch.no_grad()\ndef exhaustive_loss(model, ids, T=128, B=64):\n    \"\"\"Mean CE over non-overlapping windows covering the whole split.\"\"\"\n    xs, ys = zip(*sequential_windows(ids, T, stride=T))\n    total, n = 0.0, 0\n    for i in range(0, len(xs), B):\n        x, y = torch.stack(xs[i:i + B]), torch.stack(ys[i:i + B])\n        logits, _ = model(x)\n        total += F.cross_entropy(logits.view(-1, logits.size(-1)), y.view(-1), reduction=\"sum\").item()\n        n += y.numel()\n    return total / n, n\n\n\ndef main():\n    model, tok, ckpt = load_for_inference(CKPT)\n    cfg = model.cfg\n    text = load_text(\"data/input.txt\")\n    tr_txt, va_txt, te_txt = split_text(text)\n    val = torch.tensor(tok.encode(va_txt, strict=False))\n    test = torch.tensor(tok.encode(te_txt, strict=False))\n\n    params = [{\"name\": n, \"shape\": list(p.shape), \"numel\": p.numel()} for n, p in model.named_parameters()]\n\n    # checkpoint contents\n    raw = load_checkpoint(CKPT)\n    opt_state = raw[\"optimizer\"][\"state\"]\n    opt_bytes = sum(t.numel() * t.element_size() for s in opt_state.values() for t in s.values()\n                    if isinstance(t, torch.Tensor))\n    model_bytes = sum(t.numel() * t.element_size() for t in raw[\"model\"].values())\n    contents = [\n        {\"key\": \"model\", \"what\": f\"state_dict, {len(raw['model'])} tensors\", \"bytes\": model_bytes, \"infer\": True, \"resume\": True},\n        {\"key\": \"model_config\", \"what\": json.dumps(raw[\"model_config\"]), \"bytes\": None, \"infer\": True, \"resume\": True},\n        {\"key\": \"tokenizer\", \"what\": f\"{len(raw['tokenizer']['chars'])} characters + <unk>\", \"bytes\": None, \"infer\": True, \"resume\": True},\n        {\"key\": \"optimizer\", \"what\": f\"AdamW exp_avg + exp_avg_sq + step for {len(opt_state)} tensors\", \"bytes\": opt_bytes, \"infer\": False, \"resume\": True},\n        {\"key\": \"step\", \"what\": str(raw[\"step\"]), \"bytes\": None, \"infer\": False, \"resume\": True},\n        {\"key\": \"train_config\", \"what\": \"lr schedule, batch size, eval settings\", \"bytes\": None, \"infer\": False, \"resume\": True},\n        {\"key\": \"rng\", \"what\": \"Python, NumPy, torch CPU/CUDA, data-sampler generator\", \"bytes\": None, \"infer\": False, \"resume\": True},\n        {\"key\": \"data\", \"what\": f\"sha256 {raw['data']['sha256'][:16]}..., split sizes {raw['data']['split_chars']}\", \"bytes\": None, \"infer\": False, \"resume\": True},\n    ]\n\n    # reload equivalence: save -> load into a fresh model -> compare logits\n    with tempfile.TemporaryDirectory() as d:\n        p = Path(d) / \"copy.pt\"\n        save_checkpoint(p, model=model, optimizer=None, step=raw[\"step\"], tokenizer=tok, train_cfg={})\n        m2, _, _ = load_for_inference(p)\n        x = val[None, :128]\n        with torch.no_grad():\n            l1, l2 = model(x)[0], m2(x)[0]\n        reload_diff = (l1 - l2).abs().max().item()\n\n    val_loss, val_n = exhaustive_loss(model, val)\n    test_loss, test_n = exhaustive_loss(model, test)\n\n    # attention maps for one validation prompt\n    start = va_txt.find(\"\\n\") + 1\n    prompt = va_txt[start:start + 48]\n    pid = torch.tensor([tok.encode(prompt)])\n    tr = {}\n    with torch.no_grad():\n        logits, _ = model(pid, trace=tr)\n    attn = [[rnd(tr[f\"block{l}\"][\"probs\"][0, h].tolist(), 3) for h in range(cfg.n_head)] for l in range(cfg.n_layer)]\n    probs = torch.softmax(logits[0, -1], -1)\n    top = torch.topk(probs, 10)\n    next_dist = [{\"char\": tok.itos[i], \"p\": round(p, 4)} for p, i in zip(top.values.tolist(), top.indices.tolist())]\n\n    # one training-mode batch: per-parameter gradient norms\n    model.train()\n    g = torch.Generator().manual_seed(7)\n    ids_tr = torch.tensor(tok.encode(tr_txt[:200000]))\n    starts = torch.randint(len(ids_tr) - 129, (32,), generator=g).tolist()\n    xb = torch.stack([ids_tr[s:s + 128] for s in starts])\n    yb = torch.stack([ids_tr[s + 1:s + 129] for s in starts])\n    torch.manual_seed(0)\n    _, loss = model(xb, yb)\n    loss.backward()\n    grad_norms = [{\"name\": n, \"norm\": p.grad.norm().item()} for n, p in model.named_parameters()]\n    model.zero_grad(set_to_none=True)\n    model.eval()\n\n    samples = []\n    for prompt_s, temp, seed in ((\"ROMEO:\\n\", 0.8, 1), (\"JULIET:\\n\", 0.8, 2), (\"\\n\", 0.5, 3), (\"\\n\", 1.0, 3), (\"KING\", 0.0, 0)):\n        gen = torch.Generator().manual_seed(seed)\n        out = generate(model, torch.tensor([tok.encode(prompt_s)]), 300, temp, None, gen)\n        samples.append({\"prompt\": prompt_s, \"temperature\": temp, \"seed\": seed, \"text\": tok.decode(out[0].tolist())})\n\n    # one real request through the FastAPI app\n    from fastapi.testclient import TestClient\n    os.environ[\"CKPT\"] = str(CKPT)\n    import serve\n    req = {\"prompt\": \"ROMEO:\\n\", \"max_new_tokens\": 120, \"temperature\": 0.8, \"seed\": 1}\n    with TestClient(serve.app) as c:\n        resp = c.post(\"/generate\", json=req).json()\n        bad = c.post(\"/generate\", json={\"prompt\": \"Hello 👋\"})\n        bad_resp = {\"status\": bad.status_code, \"body\": bad.json()}\n\n    log = [json.loads(l) for l in open(\"out/log.jsonl\")]\n    out = {\n        \"provenance\": \"Measured from out/ckpt.pt by export_trained.py\",\n        \"env\": {\"torch\": torch.__version__, \"python\": sys.version.split()[0], \"platform\": platform.platform(),\n                \"device\": \"cpu\", \"threads\": torch.get_num_threads()},\n        \"config\": {**cfg.to_dict(), \"head_dim\": cfg.head_dim, \"d_ff\": cfg.d_ff},\n        \"train_config\": raw[\"train_config\"],\n        \"step\": raw[\"step\"],\n        \"num_params\": model.num_params(),\n        \"params\": params,\n        \"vocab\": tok.itos,\n        \"data\": raw[\"data\"],\n        \"ckpt_file_bytes\": CKPT.stat().st_size,\n        \"ckpt_contents\": contents,\n        \"reload_max_abs_diff\": reload_diff,\n        \"val_loss_exhaustive\": val_loss, \"val_targets\": val_n,\n        \"test_loss_exhaustive\": test_loss, \"test_targets\": test_n,\n        \"attention\": {\"prompt\": prompt, \"maps\": attn, \"next\": next_dist},\n        \"grad_norms\": grad_norms, \"grad_norm_batch_loss\": loss.item(),\n        \"samples\": samples,\n        \"serve\": {\"request\": req, \"response\": resp, \"bad_request\": {\"prompt\": \"Hello 👋\"}, \"bad_response\": bad_resp},\n        \"log\": [{k: (round(v, 5) if isinstance(v, float) else v) for k, v in r.items()} for r in log],\n    }\n    Path(\"web/data/trained.json\").write_text(json.dumps(out))\n    print(f\"step={raw['step']} params={model.num_params():,} val={val_loss:.4f} test={test_loss:.4f} \"\n          f\"ppl={math.exp(val_loss):.2f} reload_diff={reload_diff}\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "build.py": "\"\"\"Assemble TransformerAtlas.html: one self-contained page with the source code,\ncorpus facts, recorded traces and test results embedded.\n\npython build.py                       # uses web/data/*.json and runs pytest for the report\npython build.py --skip-tests          # reuse web/data/tests.json\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport subprocess\nimport sys\nimport xml.etree.ElementTree as ET\nfrom pathlib import Path\n\nfrom data import TINY_SHAKESPEARE_URL, load_text, sha256_of, split_text\nfrom tokenizer import CharTokenizer\n\nROOT = Path(__file__).resolve().parent\nWEB = ROOT / \"web\"\nSOURCES = [\"config.py\", \"tokenizer.py\", \"data.py\", \"model.py\", \"train.py\", \"checkpoint.py\", \"generate.py\",\n           \"serve.py\", \"measure_memory.py\", \"export_micro.py\", \"export_trained.py\", \"build.py\",\n           \"tests/test_llm.py\", \"requirements.txt\", \"README.md\"]\nTEST_DOCS = {\n    \"test_tokenizer_roundtrip\": \"decode(encode(s)) == s on train, val and test text; V = 66 with <unk> at 0\",\n    \"test_unseen_characters\": \"strict encoding raises; non-strict maps to <unk> and decodes to U+FFFD\",\n    \"test_tokenizer_serialization\": \"vocabulary JSON round trip\",\n    \"test_shift_by_one\": \"y is x shifted by exactly one token\",\n    \"test_windows_stay_inside_split\": \"1,280 random validation windows are substrings of the validation text\",\n    \"test_shapes_and_head_split_merge\": \"tensor shapes; head h = columns h·Dh…; split→merge is exact\",\n    \"test_causal_mask_no_future_leakage\": \"changing tokens 5–7 leaves logits 0–4 bit-identical\",\n    \"test_unmasked_attention_does_leak\": \"removing the mask makes position 0 depend on position 7\",\n    \"test_attention_rows_sum_to_one_before_dropout\": \"rows sum to 1 and the upper triangle is 0, with dropout active\",\n    \"test_matches_pytorch_sdpa\": \"explicit attention equals F.scaled_dot_product_attention(is_causal=True)\",\n    \"test_loss_and_gradients_finite_and_complete\": \"finite loss ≈ ln V at init; every parameter gets a finite gradient\",\n    \"test_cross_entropy_equals_manual_nll\": \"F.cross_entropy == −mean(log_softmax[y]); softmax-first differs\",\n    \"test_optimizer_step_changes_parameters\": \"one AdamW step changes every parameter tensor\",\n    \"test_overfit_single_batch\": \"a tiny model drives one batch's loss below 0.05\",\n    \"test_gradient_accumulation_matches_full_batch\": \"two scaled microbatches reproduce the full-batch gradient\",\n    \"test_finite_difference_gradient\": \"central differences match autograd in float64 for 12 entries\",\n    \"test_weight_tying_counts_and_gradient_sum\": \"tying removes V·D parameters; tied grad = sum of both paths\",\n    \"test_token_ids_receive_no_gradient_but_embeddings_do\": \"unused embedding rows get exactly zero gradient\",\n    \"test_checkpoint_roundtrip\": \"save → load_for_inference gives equal logits; optimizer state stored\",\n    \"test_resume_is_bit_exact\": \"6 straight steps == 3 steps + resume + 3 steps, every weight torch.equal\",\n    \"test_generation_shape_and_validity\": \"output length and id range; greedy works\",\n    \"test_serve_endpoint\": \"200 on valid prompt; 422 on unknown characters, too many tokens, empty prompt\",\n}\n\n\ndef corpus_facts() -> dict:\n    path = ROOT / \"data\" / \"input.txt\"\n    raw = path.read_bytes()\n    text = load_text(path)\n    tr, va, te = split_text(text)\n    tok = CharTokenizer.build(tr)\n    train_lines = set(l for l in tr.split(\"\\n\"))\n    def dup_stats(min_len):\n        lines = [l for l in va.split(\"\\n\") if len(l) > min_len]\n        return {\"lines\": len(lines), \"dups\": sum(1 for l in lines if l in train_lines)}\n    dup = {\"any\": dup_stats(0), \"gt10\": dup_stats(10), \"gt20\": dup_stats(20)}\n    n = len(text)\n    i, j = len(tr), len(tr) + len(va)\n    return {\n        \"url\": TINY_SHAKESPEARE_URL, \"sha256\": sha256_of(path), \"bytes\": len(raw), \"chars\": n,\n        \"lines\": text.count(\"\\n\"), \"cr\": raw.count(b\"\\r\"), \"non_ascii\": sum(1 for c in text if ord(c) > 127),\n        \"unique\": len(set(text)), \"split\": [len(tr), len(va), len(te)],\n        \"boundaries\": [{\"name\": \"train | val\", \"index\": i, \"before\": text[i - 70:i], \"after\": text[i:i + 70]},\n                       {\"name\": \"val | test\", \"index\": j, \"before\": text[j - 70:j], \"after\": text[j:j + 70]}],\n        \"dup_val_lines\": dup, \"vocab\": tok.itos,\n        \"unk_val\": sum(1 for c in va if c not in tok.stoi), \"unk_test\": sum(1 for c in te if c not in tok.stoi),\n        \"head\": text[:420], \"strip_ids\": tok.encode(tr[:72]), \"bpe_text\": tr[:3000],\n        \"license\": \"The char-rnn repository (Andrej Karpathy) states the MIT license in its README; it has no separate LICENSE file. \"\n                   \"The text is a subset of William Shakespeare's works, which are in the public domain. \"\n                   \"The edition the excerpt was taken from is not documented.\",\n    }\n\n\ndef run_tests(skip: bool) -> list:\n    out = WEB / \"data\" / \"tests.json\"\n    if not skip:\n        xml = ROOT / \"out\" / \"pytest.xml\"\n        subprocess.run([sys.executable, \"-m\", \"pytest\", \"-q\", \"tests\", f\"--junitxml={xml}\"], cwd=ROOT)\n        res = []\n        for tc in ET.parse(xml).getroot().iter(\"testcase\"):\n            outcome = \"failed\" if tc.find(\"failure\") is not None or tc.find(\"error\") is not None else \\\n                      \"skipped\" if tc.find(\"skipped\") is not None else \"passed\"\n            res.append({\"name\": tc.get(\"name\"), \"outcome\": outcome, \"time\": float(tc.get(\"time\", 0)),\n                        \"doc\": TEST_DOCS.get(tc.get(\"name\"), \"\")})\n        out.write_text(json.dumps(res))\n    return json.loads(out.read_text())\n\n\ndef main():\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--skip-tests\", action=\"store_true\")\n    args = ap.parse_args()\n    data = {\n        \"micro\": json.loads((WEB / \"data\" / \"micro.json\").read_text()),\n        \"trained\": json.loads((WEB / \"data\" / \"trained.json\").read_text()),\n        \"sources\": {s: (ROOT / s).read_text(encoding=\"utf-8\") for s in SOURCES},\n        \"corpus\": corpus_facts(),\n        \"tests\": run_tests(args.skip_tests),\n    }\n    checks = WEB / \"data\" / \"html_checks.json\"\n    data[\"htmlChecks\"] = json.loads(checks.read_text()) if checks.exists() else None\n    blob = json.dumps(data, ensure_ascii=False).replace(\"<\/\", \"<\\\\/\").replace(\"\\ufffd\", \"\\\\ufffd\")\n    tpl = (WEB / \"index.template.html\").read_text(encoding=\"utf-8\")\n    js = \"\\n\".join((WEB / f).read_text(encoding=\"utf-8\") for f in (\"engine.js\", \"app.js\", \"chapters1.js\", \"chapters2.js\"))\n    # Order matters: the embedded sources (build.py itself) contain these markers too,\n    # so each one is replaced once, at its first occurrence, before data is inserted after it.\n    html = tpl.replace(\"/*__JS__*/\", js.replace(\"<\/script\", \"<\\\\/script\"), 1)\n    html = html.replace(\"/*__CSS__*/\", (WEB / \"styles.css\").read_text(encoding=\"utf-8\"), 1)\n    html = html.replace(\"__DATA__\", blob, 1)\n    (ROOT / \"TransformerAtlas.html\").write_text(html, encoding=\"utf-8\")\n    print(f\"wrote TransformerAtlas.html ({len(html.encode()) / 1024:.0f} KiB); tests: \"\n          f\"{sum(t['outcome'] == 'passed' for t in data['tests'])}/{len(data['tests'])} passed\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "tests/test_llm.py": "\"\"\"Verification suite.  Run:  python -m pytest -q tests\"\"\"\nfrom __future__ import annotations\n\nimport math\nimport os\nimport subprocess\nimport sys\nfrom pathlib import Path\n\nimport pytest\nimport torch\nimport torch.nn.functional as F\n\nROOT = Path(__file__).resolve().parents[1]\nsys.path.insert(0, str(ROOT))\n\nfrom checkpoint import load_checkpoint, load_for_inference, save_checkpoint  # noqa: E402\nfrom config import ModelConfig, TrainConfig  # noqa: E402\nfrom data import get_batch, load_text, split_text  # noqa: E402\nfrom generate import generate  # noqa: E402\nfrom model import GPT  # noqa: E402\nfrom tokenizer import UNK_DECODED, UNK_ID, CharTokenizer, UnknownCharacterError  # noqa: E402\nfrom train import make_optimizer  # noqa: E402\n\nDATA = ROOT / \"data\" / \"input.txt\"\n\n\n@pytest.fixture(scope=\"module\")\ndef corpus():\n    text = load_text(DATA)\n    tr, va, te = split_text(text)\n    return text, tr, va, te, CharTokenizer.build(tr)\n\n\ndef tiny_cfg(**kw):\n    base = dict(vocab_size=20, block_size=8, n_layer=2, n_head=2, n_embd=16, dropout=0.0)\n    base.update(kw)\n    return ModelConfig(**base)\n\n\n# ---------------- tokenizer ----------------\ndef test_tokenizer_roundtrip(corpus):\n    _, tr, va, te, tok = corpus\n    assert tok.vocab_size == 66 and tok.itos[0] == \"<unk>\"\n    for s in (tr[:5000], va[:5000], te[:5000]):\n        assert tok.decode(tok.encode(s)) == s\n\n\ndef test_unseen_characters(corpus):\n    tok = corpus[4]\n    with pytest.raises(UnknownCharacterError) as e:\n        tok.encode(\"Hello ✓\")\n    assert e.value.chars == [\"✓\"]\n    ids = tok.encode(\"Hi✓\", strict=False)\n    assert ids[-1] == UNK_ID and tok.decode(ids) == \"Hi\" + UNK_DECODED\n    with pytest.raises(ValueError):\n        tok.decode([tok.vocab_size])\n\n\ndef test_tokenizer_serialization(tmp_path, corpus):\n    tok = corpus[4]\n    tok.save(tmp_path / \"v.json\")\n    assert CharTokenizer.load(tmp_path / \"v.json\").itos == tok.itos\n\n\n# ---------------- data ----------------\ndef test_shift_by_one():\n    data = torch.arange(100)\n    x, y = get_batch(data, 16, 10, \"cpu\", torch.Generator().manual_seed(0))\n    assert x.shape == y.shape == (16, 10)\n    assert torch.equal(y, x + 1)                 # with data = arange, target = next token\n    assert torch.equal(y[:, :-1], x[:, 1:])\n\n\ndef test_windows_stay_inside_split(corpus):\n    _, tr, va, te, tok = corpus\n    val = torch.tensor(tok.encode(va))\n    g = torch.Generator().manual_seed(1)\n    for _ in range(20):\n        x, y = get_batch(val, 64, 128, \"cpu\", g)\n        for row_x, row_y in zip(x, y):\n            window = tok.decode(row_x.tolist()) + tok.decode(row_y[-1:].tolist())\n            assert window in va                  # every window is a substring of the val text\n    assert len(tr) + len(va) + len(te) == len(corpus[0])\n\n\n# ---------------- model shapes & attention ----------------\ndef test_shapes_and_head_split_merge():\n    cfg = tiny_cfg()\n    m = GPT(cfg).eval()\n    idx = torch.randint(0, 20, (3, 8))\n    tr = {}\n    logits, _ = m(idx, trace=tr)\n    B, T, D, H, Dh = 3, 8, 16, 2, 8\n    assert logits.shape == (B, T, 20)\n    b0 = tr[\"block0\"]\n    assert b0[\"scores_raw\"].shape == (B, H, T, T)\n    assert b0[\"head_out\"].shape == (B, H, T, Dh)\n    assert b0[\"merged\"].shape == (B, T, D)\n    q = torch.randn(B, T, D)\n    split = q.view(B, T, H, Dh).transpose(1, 2)\n    merged = split.transpose(1, 2).contiguous().view(B, T, D)\n    assert torch.equal(merged, q)\n    assert torch.equal(split[:, 1, :, :], q[:, :, Dh:2 * Dh])   # head 1 owns columns Dh..2Dh-1\n\n\ndef test_causal_mask_no_future_leakage():\n    m = GPT(tiny_cfg()).eval()\n    a = torch.randint(0, 20, (1, 8))\n    b = a.clone()\n    b[0, 5:] = (b[0, 5:] + 7) % 20               # change only positions 5..7\n    la, _ = m(a)\n    lb, _ = m(b)\n    assert torch.allclose(la[0, :5], lb[0, :5], atol=0, rtol=0)\n    assert not torch.allclose(la[0, 5:], lb[0, 5:])\n\n\ndef test_unmasked_attention_does_leak():\n    m = GPT(tiny_cfg()).eval()\n    for blk in m.blocks:\n        blk.attn.causal = False\n    a = torch.randint(0, 20, (1, 8))\n    b = a.clone()\n    b[0, 7] = (b[0, 7] + 1) % 20\n    assert not torch.allclose(m(a)[0][0, 0], m(b)[0][0, 0])   # position 0 now sees position 7\n\n\ndef test_attention_rows_sum_to_one_before_dropout():\n    m = GPT(tiny_cfg(dropout=0.5)).train()\n    tr = {}\n    m(torch.randint(0, 20, (2, 8)), trace=tr)\n    p = tr[\"block0\"][\"probs\"]\n    assert torch.allclose(p.sum(-1), torch.ones_like(p.sum(-1)), atol=1e-6)\n    assert torch.all(torch.triu(p, diagonal=1) == 0)\n\n\ndef test_matches_pytorch_sdpa():\n    cfg = tiny_cfg()\n    attn = GPT(cfg).blocks[0].attn.eval()\n    x = torch.randn(2, 8, 16)\n    ours = attn(x)\n    B, T, D, H, Dh = 2, 8, 16, 2, 8\n    q = attn.q_proj(x).view(B, T, H, Dh).transpose(1, 2)\n    k = attn.k_proj(x).view(B, T, H, Dh).transpose(1, 2)\n    v = attn.v_proj(x).view(B, T, H, Dh).transpose(1, 2)\n    y = F.scaled_dot_product_attention(q, k, v, is_causal=True)\n    ref = attn.out_proj(y.transpose(1, 2).reshape(B, T, D))\n    assert torch.allclose(ours, ref, atol=1e-6)\n\n\n# ---------------- loss, gradients, optimizer ----------------\ndef test_loss_and_gradients_finite_and_complete():\n    m = GPT(tiny_cfg())\n    x = torch.randint(0, 20, (4, 8))\n    _, loss = m(x, torch.randint(0, 20, (4, 8)))\n    assert math.isfinite(loss.item())\n    assert abs(loss.item() - math.log(20)) < 0.2   # near-uniform predictions at init\n    loss.backward()\n    for n, p in m.named_parameters():\n        assert p.grad is not None and torch.isfinite(p.grad).all(), n\n\n\ndef test_cross_entropy_equals_manual_nll():\n    logits = torch.randn(6, 11)\n    y = torch.randint(0, 11, (6,))\n    manual = -(logits.log_softmax(-1)[torch.arange(6), y]).mean()\n    assert torch.allclose(F.cross_entropy(logits, y), manual, atol=1e-6)\n    double = F.cross_entropy(logits.softmax(-1), y)  # the classic bug: softmax applied twice\n    assert not torch.allclose(double, manual)\n\n\ndef test_optimizer_step_changes_parameters():\n    m = GPT(tiny_cfg())\n    opt = make_optimizer(m, TrainConfig(lr=1e-2))\n    before = {n: p.detach().clone() for n, p in m.named_parameters()}\n    _, loss = m(torch.randint(0, 20, (4, 8)), torch.randint(0, 20, (4, 8)))\n    loss.backward()\n    opt.step()\n    changed = [n for n, p in m.named_parameters() if not torch.equal(p, before[n])]\n    assert len(changed) == len(before)\n\n\ndef test_overfit_single_batch():\n    torch.manual_seed(0)\n    m = GPT(tiny_cfg(n_embd=32))\n    opt = torch.optim.AdamW(m.parameters(), lr=3e-3)\n    x, y = torch.randint(0, 20, (2, 8)), torch.randint(0, 20, (2, 8))\n    for _ in range(300):\n        opt.zero_grad()\n        _, loss = m(x, y)\n        loss.backward()\n        opt.step()\n    assert loss.item() < 0.05\n\n\ndef test_gradient_accumulation_matches_full_batch():\n    torch.manual_seed(0)\n    m = GPT(tiny_cfg())\n    x, y = torch.randint(0, 20, (4, 8)), torch.randint(0, 20, (4, 8))\n    m(x, y)[1].backward()\n    full = m.lm_head.weight.grad.clone()\n    m.zero_grad()\n    for xs, ys in ((x[:2], y[:2]), (x[2:], y[2:])):\n        (m(xs, ys)[1] / 2).backward()\n    assert torch.allclose(full, m.lm_head.weight.grad, atol=1e-6)\n\n\ndef test_finite_difference_gradient():\n    torch.manual_seed(3)\n    m = GPT(tiny_cfg()).double()\n    x, y = torch.randint(0, 20, (2, 8)), torch.randint(0, 20, (2, 8))\n    m(x, y)[1].backward()\n    eps = 1e-6\n    for name in (\"tok_emb.weight\", \"blocks.0.attn.q_proj.weight\", \"blocks.1.ffn.fc1.bias\", \"ln_f.weight\"):\n        p = dict(m.named_parameters())[name]\n        flat = p.data.view(-1)\n        for i in (0, flat.numel() // 2, flat.numel() - 1):\n            old = flat[i].item()\n            flat[i] = old + eps\n            lp = m(x, y)[1].item()\n            flat[i] = old - eps\n            lm = m(x, y)[1].item()\n            flat[i] = old\n            num = (lp - lm) / (2 * eps)\n            ana = p.grad.view(-1)[i].item()\n            assert abs(num - ana) < 1e-6 + 1e-4 * abs(ana), (name, i, num, ana)\n\n\ndef test_weight_tying_counts_and_gradient_sum():\n    untied = GPT(tiny_cfg())\n    tied = GPT(tiny_cfg(tie_weights=True))\n    assert untied.num_params() - tied.num_params() == 20 * 16\n    # copy tied weights into an untied model; tied grad must equal the sum of both paths\n    untied.load_state_dict({**tied.state_dict()})\n    x, y = torch.randint(0, 20, (2, 8)), torch.randint(0, 20, (2, 8))\n    tied(x, y)[1].backward()\n    untied(x, y)[1].backward()\n    expected = untied.tok_emb.weight.grad + untied.lm_head.weight.grad\n    assert torch.allclose(tied.tok_emb.weight.grad, expected, atol=1e-6)\n\n\ndef test_token_ids_receive_no_gradient_but_embeddings_do():\n    m = GPT(tiny_cfg())\n    x = torch.tensor([[3, 3, 5, 3, 1, 2, 2, 9]])\n    _, loss = m(x, torch.randint(0, 20, (1, 8)))\n    loss.backward()\n    g = m.tok_emb.weight.grad\n    assert not x.requires_grad\n    unused = [i for i in range(20) if i not in x.tolist()[0]]\n    assert torch.all(g[unused] == 0)              # rows never selected get exactly zero gradient\n    assert g[3].abs().sum() > 0\n\n\n# ---------------- persistence & generation ----------------\ndef test_checkpoint_roundtrip(tmp_path):\n    torch.manual_seed(0)\n    m = GPT(tiny_cfg(dropout=0.1))\n    tok = CharTokenizer(list(\"abcdefghijklmnopqrs\"))   # 19 chars + <unk> = 20\n    opt = make_optimizer(m, TrainConfig())\n    save_checkpoint(tmp_path / \"c.pt\", model=m, optimizer=opt, step=7, tokenizer=tok,\n                    train_cfg=TrainConfig().to_dict(), data_gen=torch.Generator().manual_seed(1))\n    m2, tok2, ck = load_for_inference(tmp_path / \"c.pt\")\n    m.eval()\n    x = torch.randint(0, 20, (2, 8))\n    assert torch.allclose(m(x)[0], m2(x)[0], atol=1e-6, rtol=0)\n    assert ck[\"step\"] == 7 and tok2.itos == tok.itos and ck[\"optimizer\"] is not None\n\n\ndef test_resume_is_bit_exact(tmp_path):\n    common = [sys.executable, str(ROOT / \"train.py\"), \"--n_layer\", \"1\", \"--n_embd\", \"32\",\n              \"--n_head\", \"2\", \"--block_size\", \"16\", \"--batch_size\", \"4\", \"--eval_interval\", \"3\",\n              \"--eval_iters\", \"1\", \"--sample_chars\", \"5\", \"--data_path\", str(DATA)]\n    run = lambda *a: subprocess.run(common + list(a), check=True, cwd=ROOT, capture_output=True)\n    run(\"--max_steps\", \"6\", \"--out_dir\", str(tmp_path / \"a\"))\n    run(\"--max_steps\", \"3\", \"--out_dir\", str(tmp_path / \"b\"))\n    run(\"--max_steps\", \"6\", \"--out_dir\", str(tmp_path / \"b\"), \"--resume\")\n    a = load_checkpoint(tmp_path / \"a\" / \"ckpt.pt\")[\"model\"]\n    b = load_checkpoint(tmp_path / \"b\" / \"ckpt.pt\")[\"model\"]\n    for k in a:\n        assert torch.equal(a[k], b[k]), k\n\n\ndef test_generation_shape_and_validity():\n    m = GPT(tiny_cfg())\n    out = generate(m, torch.zeros(2, 3, dtype=torch.long), 20, 1.0, 5, torch.Generator().manual_seed(0))\n    assert out.shape == (2, 23)\n    assert out.min() >= 0 and out.max() < 20\n    greedy = generate(m, torch.zeros(1, 3, dtype=torch.long), 5, 0.0)\n    assert greedy.shape == (1, 8)\n\n\ndef test_serve_endpoint(tmp_path):\n    from fastapi.testclient import TestClient\n    m = GPT(tiny_cfg())\n    tok = CharTokenizer(list(\"abcdefghijklmnopqrs\"))\n    save_checkpoint(tmp_path / \"c.pt\", model=m, optimizer=None, step=0, tokenizer=tok, train_cfg={})\n    os.environ[\"CKPT\"] = str(tmp_path / \"c.pt\")\n    import serve\n    with TestClient(serve.app) as c:\n        r = c.post(\"/generate\", json={\"prompt\": \"abc\", \"max_new_tokens\": 10, \"seed\": 1})\n        assert r.status_code == 200 and r.json()[\"generated_tokens\"] == 10\n        r = c.post(\"/generate\", json={\"prompt\": \"abZ\"})\n        assert r.status_code == 422 and r.json()[\"detail\"][\"unknown_characters\"] == [\"Z\"]\n        assert c.post(\"/generate\", json={\"prompt\": \"a\", \"max_new_tokens\": 5000}).status_code == 422\n        assert c.post(\"/generate\", json={\"prompt\": \"\"}).status_code == 422\n", "requirements.txt": "# Versions used to build, test and record every number in TransformerAtlas.html (Python 3.13, CPU)\ntorch==2.14.1\nnumpy==2.5.3\nfastapi==0.143.0\nuvicorn==0.53.0\npydantic==2.13.5\nhttpx==0.28.1      # FastAPI TestClient (tests, export_trained.py)\npytest==9.1.1\n", "README.md": "# Transformer Atlas\n\nAn interactive technical reference for a decoder-only Transformer language model, built around one\ncanonical PyTorch implementation that you can run end to end: raw text → split → character tokenizer →\nwindows → embeddings → Transformer blocks → logits → cross-entropy → backprop → AdamW → evaluation →\ncheckpoint → reload → generation → HTTP endpoint.\n\n**Open `TransformerAtlas.html` in a browser.** It is a single self-contained file (code, data excerpts,\nrecorded traces and the in-browser compute engine are embedded). It works offline; only the Geist web\nfonts come from Google Fonts, with system-font fallback.\n\n## What is real and what is not\n\n| Label in the page | Meaning |\n|---|---|\n| Computed in your browser | A JavaScript port of the micro model (forward pass, hand-written backward pass, AdamW). On load it is compared against the PyTorch record; worst difference ≈ 1e-6 (float32 rounding). |\n| Recorded from PyTorch | Saved from executing the Python in this folder (`export_micro.py`, `export_trained.py`, `train.py`, pytest). |\n| Analytical estimate | Formula-based (GPU memory, FLOPs) with every assumption stated. |\n| Illustrative | Teaching sketches and general guidance, not measurements. |\n\nThe static page does not train the full model. Training happens in Python.\n\n## Files\n\n| File | Responsibility |\n|---|---|\n| `config.py` | `ModelConfig`, `TrainConfig`, notation, the micro configuration |\n| `tokenizer.py` | Reversible character tokenizer, `<unk>` policy, serialisation |\n| `data.py` | UTF-8 loading, contiguous split, window sampling |\n| `model.py` | Explicit GPT: embeddings, Pre-LN blocks, causal multi-head attention, GELU FFN, LM head |\n| `train.py` | Seeds, device, AdamW groups, warmup + cosine, clipping, accumulation, eval, checkpoints, resume |\n| `checkpoint.py` | Save/load for inference and for exact resume (optimizer + RNG states) |\n| `generate.py` | Autoregressive sampling (greedy / temperature / top-k) |\n| `serve.py` | Minimal FastAPI endpoint (educational) |\n| `measure_memory.py` | Peak CUDA memory for one training step |\n| `export_micro.py`, `export_trained.py` | Record the traces the page displays |\n| `build.py` | Assemble `TransformerAtlas.html` from `web/` |\n| `tests/test_llm.py` | 22 verification tests |\n\n## Commands\n\n```bash\npython -m venv .venv && source .venv/bin/activate\npip install -r requirements.txt\nmkdir -p data && curl -L -o data/input.txt \\\n  https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt\nshasum -a 256 data/input.txt   # 86c4e6aa9db7c042ec79f339dcb96d42b0075e16b8fc2e86bf0ca57e2dc565ed\n\npython -m pytest -q tests                         # verification suite\npython train.py                                   # 5,000 steps; writes out/ckpt.pt, out/log.jsonl, out/vocab.json\npython train.py --resume                          # continue from out/ckpt.pt\npython generate.py --prompt \"ROMEO:\" --temperature 0.8\nCKPT=out/ckpt.pt uvicorn serve:app --port 8000    # then:\ncurl -s localhost:8000/generate -H 'content-type: application/json' \\\n  -d '{\"prompt\": \"ROMEO:\\n\", \"max_new_tokens\": 120, \"temperature\": 0.8, \"seed\": 1}'\npython measure_memory.py --batch_size 32 --block_size 128   # needs a CUDA GPU\n\npython export_micro.py && python export_trained.py && python build.py   # rebuild the page\n```\n\nUseful training flags: `--device cuda`, `--batch_size`, `--grad_accum`, `--block_size`, `--n_layer`,\n`--n_head`, `--n_embd`, `--dropout`, `--tie_weights`, `--lr`, `--max_steps`.\n\n## Dataset\n\nTiny Shakespeare from `karpathy/char-rnn` (repository README states the MIT license; the text is a subset of\nShakespeare's public-domain works; the source edition is not documented). 1,115,394 characters, 65 distinct,\npure ASCII, no carriage returns. Split contiguously 90 / 5 / 5 % before windowing.\n\n## Scope\n\nThe model is small (826,624 parameters, character-level) and learns the surface statistics of the text.\nIt is not an instruction-following assistant. Deferred topics: subword tokenizers, mixed precision,\ndistributed training, KV caching, batching, quantization, fine-tuning and preference optimisation.\n\nSee `VALIDATION.md` for what was executed and verified.\n"}, "corpus": {"url": "https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt", "sha256": "86c4e6aa9db7c042ec79f339dcb96d42b0075e16b8fc2e86bf0ca57e2dc565ed", "bytes": 1115394, "chars": 1115394, "lines": 40000, "cr": 0, "non_ascii": 0, "unique": 65, "split": [1003854, 55770, 55770], "boundaries": [{"name": "train | val", "index": 1003854, "before": "e.\n\nBAPTISTA:\nWas ever gentleman thus grieved as I?\nBut who comes here", "after": "?\n\nGREMIO:\nGood morrow, neighbour Baptista.\n\nBAPTISTA:\nGood morrow, ne"}, {"name": "val | test", "index": 1059624, "before": "thank you, sir. Where then do you know best\nWe be affied and such assu", "after": "rance ta'en\nAs shall with either part's agreement stand?\n\nBAPTISTA:\nNo"}], "dup_val_lines": {"any": {"lines": 1703, "dups": 395}, "gt10": {"lines": 1251, "dups": 4}, "gt20": {"lines": 1174, "dups": 0}}, "vocab": "test_loss_and_gradients_finite_and_complete", "outcome": "passed", "time": 0.008, "doc": "finite loss ≈ ln V at init; every parameter gets a finite gradient"}, {"name": "test_cross_entropy_equals_manual_nll", "outcome": "passed", "time": 0.001, "doc": "F.cross_entropy == −mean(log_softmax[y]); softmax-first differs"}, {"name": "test_optimizer_step_changes_parameters", "outcome": "passed", "time": 0.979, "doc": "one AdamW step changes every parameter tensor"}, {"name": "test_overfit_single_batch", "outcome": "passed", "time": 1.52, "doc": "a tiny model drives one batch's loss below 0.05"}, {"name": "test_gradient_accumulation_matches_full_batch", "outcome": "passed", "time": 0.015, "doc": "two scaled microbatches reproduce the full-batch gradient"}, {"name": "test_finite_difference_gradient", "outcome": "passed", "time": 0.033, "doc": "central differences match autograd in float64 for 12 entries"}, {"name": "test_weight_tying_counts_and_gradient_sum", "outcome": "passed", "time": 0.012, "doc": "tying removes V·D parameters; tied grad = sum of both paths"}, {"name": "test_token_ids_receive_no_gradient_but_embeddings_do", "outcome": "passed", "time": 0.006, "doc": "unused embedding rows get exactly zero gradient"}, {"name": "test_checkpoint_roundtrip", "outcome": "passed", "time": 0.027, "doc": "save → load_for_inference gives equal logits; optimizer state stored"}, {"name": "test_resume_is_bit_exact", "outcome": "passed", "time": 10.581, "doc": "6 straight steps == 3 steps + resume + 3 steps, every weight torch.equal"}, {"name": "test_generation_shape_and_validity", "outcome": "passed", "time": 0.029, "doc": "output length and id range; greedy works"}, {"name": "test_serve_endpoint", "outcome": "passed", "time": 0.499, "doc": "200 on valid prompt; 422 on unknown characters, too many tokens, empty prompt"}], "htmlChecks": {"browser": "141.0.7390.37", "items": [{"name": "Page boots and renders", "ok": true, "detail": ""}, {"name": "All source-code anchors resolve", "ok
