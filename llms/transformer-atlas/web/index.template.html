<title>Transformer Atlas</title>
<meta name="description" content="An interactive, inspectable reference for a decoder-only Transformer, from raw text to a served checkpoint.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/*__CSS__*/
</style>
<div id="app">
  <header class="topbar">
    <button class="icon-btn menu-btn" data-act="menu" aria-label="Show chapters"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h14M2 9h14M2 14h14" stroke="#12141a" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="2.4" rx="1.2" fill="#fff"/><rect x="2" y="6.8" width="8" height="2.4" rx="1.2" fill="#ffe27a"/><rect x="2" y="11.6" width="12" height="2.4" rx="1.2" fill="#fff"/></svg></span><span class="brand-name">Transformer Atlas</span> <small>raw text → deployment</small></div>
    <div class="example-chip" title="Running example used by every micro computation: 9 characters, the first 8 are the input, the last 8 the targets.">
      <span class="lbl">Running example</span>
      <input id="ex-in" aria-label="Running example, 9 characters" spellcheck="false" autocomplete="off" maxlength="9">
    </div>
    <div class="seg tb-dims" id="dims" role="group" aria-label="Show shapes as">
      <button data-act="dims" data-arg="sym">Symbolic</button><button data-act="dims" data-arg="micro">Micro</button><button data-act="dims" data-arg="train">Training</button>
    </div>
    <span class="tb-spacer"></span>
    <button class="btn" data-act="search" aria-label="Search"><span class="lbl-search">Search</span> <kbd>/</kbd></button>
    <button class="btn ghost hide-sm" data-act="download">Source .zip</button>
    <button class="btn ghost" data-act="reset" title="Reset every interactive control (keeps learning progress)">Reset</button>
  </header>
  <div class="main">
    <nav id="nav" class="nav" aria-label="Chapters"></nav>
    <div class="work" id="work">
      <div class="mobile-switch" id="mswitch"><div class="seg"><button data-act="pane" data-arg="visual" aria-pressed="true">Computation</button><button data-act="pane" data-arg="code" aria-pressed="false">Source</button></div></div>
      <aside class="code-pane" id="code-pane" aria-label="Source code">
        <div class="code-head" id="code-tabs" role="tablist"></div>
        <div class="code-tools" id="code-tools"></div>
        <div class="code" id="code" tabindex="0" aria-label="Source listing"></div>
      </aside>
      <div class="gutter" id="gutter" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize code and visual panes"></div>
      <main class="content">
        <div class="scroll" id="scroll"></div>
        <div class="inspector collapsed" id="inspector" aria-label="Tensor inspector">
          <div class="ins-head"><h4 id="ins-title">Inspector</h4><span style="flex:1"></span><span class="small muted hide-sm">dtype, shape, provenance and values of the selected tensor</span><button class="btn small ghost" data-act="ins-toggle">Hide / show</button></div>
          <div class="ins-body" id="ins-body"></div>
        </div>
      </main>
    </div>
  </div>
</div>
<script id="atlas-data" type="application/json">__DATA__</script>
<script>
window.__errors = [];
window.addEventListener("error", (e) => window.__errors.push(String(e.message)));
window.__DATA__ = JSON.parse(document.getElementById("atlas-data").textContent);
/*__JS__*/
boot();
</script>
